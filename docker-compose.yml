version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - FRONTEND_URL=http://localhost:3000
      # Provide your AI service keys here
      # - OLLAMA_BASE_URL=http://host.docker.internal:11434
    networks:
      - multi-agent-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - multi-agent-net

networks:
  multi-agent-net:
    driver: bridge
